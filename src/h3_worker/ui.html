<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H3 剧集生成台</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0e12;--panel:#151922;--panel2:#1b202b;--line:#2b3240;--text:#f4f6f8;--muted:#9ba6b5;--accent:#9cff57;--accent2:#6ee7f2;--warn:#ffbe4d;--bad:#ff667a;--ok:#72dfa4}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% -10%,#253323 0,transparent 32rem),var(--bg);font:15px/1.5 ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;color:var(--text)}
    button,input,textarea{font:inherit} button{cursor:pointer}.shell{width:min(1480px,calc(100% - 40px));margin:auto;padding:28px 0 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;width:44px;height:44px;border:1px solid #93cf69;border-radius:12px;background:#172416;color:var(--accent);font-weight:900;letter-spacing:-2px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.service{display:flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 16px var(--ok)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}.stack{display:grid;gap:20px}.panel{background:rgba(21,25,34,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px #0004;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:15px;margin:0}.panel-head small{color:var(--muted)}.panel-body{padding:20px}
    .drop{border:1px dashed #526078;border-radius:14px;padding:28px;text-align:center;background:#11151d;transition:.15s}.drop.drag{border-color:var(--accent);background:#172019}.drop strong{display:block;font-size:17px;margin-bottom:6px}.drop p{margin:0 0 16px;color:var(--muted)}.drop input{display:none}.btn{border:1px solid var(--line);background:#242a36;color:var(--text);padding:10px 16px;border-radius:10px;font-weight:700}.btn:hover{border-color:#536078}.btn.primary{color:#10150d;border-color:var(--accent);background:var(--accent)}.btn:disabled{opacity:.4;cursor:not-allowed}.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;background:#242a35;border-radius:8px;color:#cad1da;font-size:12px}.chip button{border:0;background:none;color:var(--muted);padding:0}.or{display:flex;align-items:center;gap:10px;color:#6f7988;font-size:11px;margin:16px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}textarea{width:100%;min-height:130px;resize:vertical;background:#0e1117;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;outline:none}textarea:focus{border-color:#617087}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
    .alert{display:none;border:1px solid #743847;background:#2b171d;border-radius:12px;padding:13px 15px;margin-bottom:16px;color:#ffd7dc}.alert.show{display:block}.alert strong{display:block;color:#ff8b9a}.alert small{color:#e1acb4}.meta{display:flex;gap:10px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--muted);font-size:12px}.tag.good{border-color:#315e46;color:var(--ok)}
    .shot-list{display:grid;gap:12px}.shot{border:1px solid var(--line);border-radius:13px;background:#11151c;overflow:hidden}.shot-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px}.shot-title{display:flex;align-items:center;gap:12px}.shot-id{font-weight:850}.shot-info{color:var(--muted);font-size:12px}.count{display:flex;align-items:center;gap:10px}.count label{color:var(--muted);font-size:12px}.count input{width:62px;background:#222834;border:1px solid #394253;border-radius:8px;color:#fff;padding:7px;text-align:center}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:0 15px 15px}.asset{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px;background:#1a1f29;border-radius:10px;min-width:0}.asset img{width:56px;height:56px;object-fit:cover;border-radius:7px;background:#0c0e12}.asset b,.asset span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset b{font-size:12px}.asset span{font-size:11px;color:var(--muted)}
    .progress-wrap{padding:20px}.progress-label{display:flex;justify-content:space-between;margin-bottom:10px}.bar{height:10px;border-radius:99px;background:#292f3b;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}.bar.indeterminate>div{width:34%;animation:slide 1.2s infinite ease-in-out}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}.current{margin-top:14px;padding:12px;background:#11151c;border-radius:10px}.current b{color:var(--accent)}.status-list{margin-top:12px;display:grid;gap:6px}.status-row{display:grid;grid-template-columns:84px 38px 1fr;gap:8px;color:var(--muted);font-size:12px}.status-row .SUCCESS{color:var(--ok)}.status-row .FAILED,.status-row .SKIPPED,.status-row .UNKNOWN_SUBMISSION{color:var(--bad)}.status-row .RUNNING,.status-row .SUBMITTED,.status-row .UPLOADING,.status-row .FINALIZING{color:var(--accent2)}
    .history-list{display:grid;gap:8px;max-height:390px;overflow:auto}.history{width:100%;text-align:left;color:var(--text);background:#11151c;border:1px solid var(--line);border-radius:11px;padding:11px}.history:hover,.history.active{border-color:#5b687b}.history b,.history span{display:block}.history span{font-size:11px;color:var(--muted)}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.video-card{background:#101319;border:1px solid var(--line);border-radius:12px;overflow:hidden}.video-card video{display:block;width:100%;aspect-ratio:16/9;background:#050607}.video-info{padding:11px 12px}.video-info b{display:block}.video-info span{color:var(--muted);font-size:11px}.empty{color:var(--muted);padding:22px;text-align:center}.hidden{display:none!important}
    details{border-top:1px solid var(--line);padding:10px 15px}summary{cursor:pointer;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;word-break:break-word;color:#cdd5df;font-size:11px}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.right{order:-1}}@media(max-width:600px){.shell{width:min(100% - 20px,1480px);padding-top:16px}header{align-items:flex-start}.service{font-size:12px}.panel-body{padding:14px}.assets{grid-template-columns:1fr}.shot-top{align-items:flex-start}.shot-info{display:none}}
  </style>
</head>
<body>
<main class="shell">
  <header><div class="brand"><div class="mark">H3</div><div><h1>剧集生成台</h1><p>Prompt 预检 · 资产映射 · 连续生成 · 视频回看</p></div></div><div class="service"><i class="dot"></i><span id="serviceText">本机服务运行中</span></div></header>
  <div id="alert" class="alert"><strong id="alertTitle"></strong><div id="alertMessage"></div><small id="alertDetail"></small></div>
  <div class="layout">
    <section class="stack">
      <article class="panel">
        <div class="panel-head"><div><h2>01 · 提交剧集 Prompt</h2><small>可上传单个总 TXT、多份分镜 TXT，或原有 YAML / JSON</small></div></div>
        <div class="panel-body">
          <div id="drop" class="drop"><strong>拖入 Prompt 文件</strong><p>首行格式：SHOT 33-16 标题</p><button id="choose" class="btn">选择文件</button><input id="files" type="file" multiple accept=".txt,.yaml,.yml,.json,text/plain"></div>
          <div id="fileList" class="file-list"></div>
          <div class="or">或者直接粘贴完整 Prompt</div>
          <textarea id="paste" placeholder="SHOT 33-16 THE APOLOGY&#10;SHOT DURATION: 5.88 seconds&#10;..."></textarea>
          <div class="actions"><button id="clear" class="btn">清空</button><button id="preflight" class="btn primary">分析并检查资产</button></div>
        </div>
      </article>
      <article id="mappingPanel" class="panel hidden">
        <div class="panel-head"><div><h2>02 · 资产映射与生成次数</h2><small id="episodeMeta"></small></div><div id="readyTag" class="tag"></div></div>
        <div class="panel-body"><div id="shotList" class="shot-list"></div><div class="actions"><label class="run-name">批次名称 <input id="runName" type="text" maxlength="80" placeholder="可选，例如 A3 E25 HMS"></label><button id="start" class="btn primary">开始连续生成</button></div></div>
      </article>
      <article class="panel">
        <div class="panel-head"><div><h2>视频结果</h2><small id="galleryMeta">选择右侧历史任务查看</small></div></div>
        <div id="gallery" class="panel-body gallery"><div class="empty">暂无视频</div></div>
      </article>
    </section>
    <aside class="stack right">
      <article class="panel">
        <div class="panel-head"><h2>运行进度</h2><span id="runState" class="tag">空闲</span></div>
        <div class="progress-wrap"><div class="progress-label"><b id="progressText">0 / 0</b><span id="progressPercent">0%</span></div><div id="bar" class="bar"><div></div></div><div id="current" class="current">尚未开始新任务</div><div id="statusList" class="status-list"></div></div>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>生成历史</h2><button id="refresh" class="btn">刷新</button></div>
        <div class="panel-body"><div id="historyList" class="history-list"><div class="empty">正在读取…</div></div></div>
      </article>
    </aside>
  </div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let chosen=[], preflightData=null, selectedRun=null, firstHistory=true, handledRun=null, handledFailure=null;
const labels={VALIDATED:'等待',UPLOADING:'上传资产',SUBMITTED:'已入队',RUNNING:'生成中',FINALIZING:'保存视频',SUCCESS:'完成',FAILED:'失败',SKIPPED:'因前序失败停止',UNKNOWN_SUBMISSION:'提交状态未知',RETRY:'重试'};
function showError(error){const e=error?.error||error||{};$('#alertTitle').textContent='需要人工介入 · '+(e.type||'错误');$('#alertMessage').textContent=e.message||'请求失败';$('#alertDetail').textContent=e.details?JSON.stringify(e.details):'';$('#alert').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}
function clearError(){$('#alert').classList.remove('show')}
async function api(url,options){const r=await fetch(url,options);let value={};try{value=await r.json()}catch{}if(!r.ok)throw value;return value}
function renderFiles(){ $('#fileList').innerHTML=chosen.map((f,i)=>`<span class="chip">${esc(f.name)} <button data-remove="${i}" aria-label="移除">×</button></span>`).join(''); }
function addFiles(files){for(const f of files){if(!chosen.some(x=>x.name===f.name&&x.size===f.size))chosen.push(f)}renderFiles()}
$('#choose').onclick=()=>$('#files').click();$('#files').onchange=e=>addFiles(e.target.files);$('#fileList').onclick=e=>{const i=e.target.dataset.remove;if(i!==undefined){chosen.splice(Number(i),1);renderFiles()}};
const drop=$('#drop');for(const name of ['dragenter','dragover'])drop.addEventListener(name,e=>{e.preventDefault();drop.classList.add('drag')});for(const name of ['dragleave','drop'])drop.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('#clear').onclick=()=>{chosen=[];$('#paste').value='';renderFiles();preflightData=null;$('#mappingPanel').classList.add('hidden');clearError()};
$('#preflight').onclick=async()=>{clearError();const button=$('#preflight');button.disabled=true;button.textContent='分析中…';try{const files=await Promise.all(chosen.map(async f=>({name:f.name,text:await f.text()})));if($('#paste').value.trim())files.push({name:'pasted-episode.txt',text:$('#paste').value});preflightData=await api('/api/preflight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files})});renderPreflight(preflightData)}catch(e){showError(e)}finally{button.disabled=false;button.textContent='分析并检查资产'}};
function renderPreflight(data){$('#mappingPanel').classList.remove('hidden');$('#episodeMeta').textContent=`${data.episode} · ${data.shots.length} 个镜头`;const tag=$('#readyTag');tag.textContent=data.ready?'预检通过':'存在错误';tag.className='tag '+(data.ready?'good':'');$('#start').disabled=!data.ready;$('#shotList').innerHTML=data.shots.map(s=>{if(!s.ready)return `<section class="shot"><div class="shot-top"><div><b class="shot-id">${esc(s.shot_id)}</b><div class="shot-info">${esc(s.errors?.map(e=>e.message).join('；'))}</div></div><span class="tag">需处理</span></div><details><summary>错误详情</summary><pre>${esc(JSON.stringify(s.errors,null,2))}</pre></details></section>`;const maps=s.mappings.map(a=>`<div class="asset" title="${esc(a.path)}"><img src="${a.thumbnail}" alt="${esc(a.asset_id)}"><div><b>${esc(a.asset_id)} → Picture ${a.picture_number}</b><span>${esc(a.filename)}</span><span>${esc(a.source)} · ${esc(a.h3_input)}</span></div></div>`).join('');return `<section class="shot"><div class="shot-top"><div class="shot-title"><b class="shot-id">${esc(s.shot_id)}</b><div class="shot-info">原始 ${s.raw_duration}s → ${s.duration}s · ${s.steps} steps · 预计 ${Number(s.expected_output_seconds).toFixed(2)}s</div></div><div class="count"><label>生成次数</label><input class="generation-count" data-shot="${esc(s.shot_id)}" type="number" min="1" max="4" value="1"></div></div><div class="assets">${maps||'<span class="tag">无静态资产</span>'}</div>${s.transformations?.length?`<details><summary>Prompt 自动处理</summary><pre>${esc(s.transformations.join('\n'))}</pre></details>`:''}</section>`}).join('');$('#mappingPanel').scrollIntoView({behavior:'smooth',block:'start'})}
$('#start').onclick=async()=>{clearError();if(!preflightData)return;const counts={};document.querySelectorAll('.generation-count').forEach(i=>counts[i.dataset.shot]=Number(i.value));const button=$('#start');button.disabled=true;button.textContent='正在启动…';try{await api('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({preflight_id:preflightData.preflight_id,generation_counts:counts,run_name:$('#runName').value.trim()||null})});await pollState()}catch(e){showError(e);button.disabled=false}finally{button.textContent='开始连续生成'}};
function renderState(state){const run=state.run, running=state.running;$('#runState').textContent=running?'运行中':'空闲';$('#runState').className='tag '+(running?'good':'');if(state.service_error)showError(state.service_error);if(!run){if(running){$('#current').innerHTML='<b>正在创建运行记录…</b>';$('#bar').classList.add('indeterminate')}return}const shots=run.shots||[],total=state.progress?.total||shots.length||0,done=state.progress?.completed||0,pct=total?Math.round(done/total*100):0;$('#progressText').textContent=`${done} / ${total}`;$('#progressPercent').textContent=pct+'%';$('#bar').classList.remove('indeterminate');$('#bar').firstElementChild.style.width=pct+'%';const failed=shots.find(s=>['FAILED','UNKNOWN_SUBMISSION'].includes(s.status));const active=running?[...shots].reverse().find(s=>['UPLOADING','SUBMITTED','RUNNING','FINALIZING','RETRY'].includes(s.status))||shots[0]:failed||[...shots].reverse().find(s=>s.status==='SUCCESS');$('#current').innerHTML=active?`<b>${esc(active.shot_id)} · V${String(active.generation_index||1).padStart(2,'0')}</b><br>${esc(labels[active.status]||active.status)}`:'尚未开始';$('#statusList').innerHTML=shots.map(s=>`<div class="status-row"><b>${esc(s.shot_id)}</b><span>V${String(s.generation_index||1).padStart(2,'0')}</span><span class="${esc(s.status)}">${esc(labels[s.status]||s.status)}</span></div>`).join('');if(!running&&failed){const key=run.batch_id+failed.shot_id+failed.generation_index;if(handledFailure!==key){handledFailure=key;showError(failed.error||{type:'GenerationFailed',message:'该镜头生成失败'})}}if(!running&&run.finished_at&&handledRun!==run.batch_id){handledRun=run.batch_id;$('#start').disabled=!preflightData?.ready;loadHistory(true);loadRun(run.batch_id)}}
async function pollState(){try{const state=await api('/api/state');renderState(state)}catch(e){$('#serviceText').textContent='本机服务连接失败'}setTimeout(pollState,1000)}
async function loadHistory(selectNewest=false){try{const data=await api('/api/runs');const list=data.runs||[];$('#historyList').innerHTML=list.length?list.map((r,i)=>`<button class="history ${selectedRun===r.batch_id?'active':''}" data-run="${esc(r.batch_id)}"><b>${esc(r.episode||'未知剧集')} · ${r.video_count||0} 个视频</b><span>${esc((r.started_at||'').replace('T',' ').slice(0,19))} · 成功 ${r.summary?.success??0} / 失败 ${r.summary?.failed??0}</span></button>`).join(''):'<div class="empty">暂无历史记录</div>';if((firstHistory||selectNewest)&&list[0]){firstHistory=false;loadRun(list[0].batch_id)}}catch(e){showError(e)}}
$('#historyList').onclick=e=>{const b=e.target.closest('[data-run]');if(b)loadRun(b.dataset.run)};$('#refresh').onclick=()=>loadHistory();
async function loadRun(id){try{const run=await api('/api/runs/'+encodeURIComponent(id));selectedRun=id;document.querySelectorAll('.history').forEach(x=>x.classList.toggle('active',x.dataset.run===id));$('#galleryMeta').textContent=`${run.run_name||run.episode||''} · ${(run.shots||[]).filter(s=>s.output).length} 个视频`;const cards=(run.shots||[]).map((s,i)=>s.output?`<article class="video-card"><video controls preload="metadata" src="/media/${encodeURIComponent(id)}/${i}"></video><div class="video-info"><b>${esc(s.shot_id)} · V${String(s.generation_index||1).padStart(2,'0')}</b><span>${esc(s.output.filename)} · ${esc(labels[s.status]||s.status)}</span></div></article>`:'').join('');$('#gallery').innerHTML=cards||'<div class="empty">该任务没有可播放的视频</div>'}catch(e){showError(e)}}
pollState();loadHistory();setInterval(()=>loadHistory(),10000);
</script>
</body>
</html>
